<!-- Contact Section -->
<section id="contact" class="section">
    <div class="container">
        <h2 class="section-title centered">Contact Us</h2>
        <div class="contact-content">
            <p>For questions about the workshop:</p>
            <p class="contact-email">
                <a href="mailto:registrations@cnimausa.com" class="mailto-link">registrations@cnimausa.com</a>
            </p>

            <!-- TODO: add real social links once you have them; remove any platform you don't use -->
            <div class="social-links">
                <a href="#" class="social-link" aria-label="Instagram">Instagram</a>
                <a href="#" class="social-link" aria-label="Facebook">Facebook</a>
            </div>

            <!-- Mailing List Signup -->
            <div class="mailing-list">
                <h3>Join Our Mailing List</h3>
                <p>Stay updated with workshop news and announcements</p>
                <form name="mailing-list" method="POST" netlify netlify-honeypot="bot-field" action="/mailing-list-success.html" class="mailing-list-form" data-netlify="true">
                    <input type="hidden" name="form-name" value="mailing-list" />
                    <p class="hidden">
                        <label>Don't fill this out if you're human: <input name="bot-field" /></label>
                    </p>
                    <div class="mailing-list-input-group">
                        <input type="email" name="email" placeholder="Enter your email address" required>
                        <button type="submit" class="btn btn-primary">Subscribe</button>
                    </div>
                </form>
                <div id="mailing-list-success" class="mailing-list-success hidden">
                    <p>✓ Thank you! You've been added to our mailing list.</p>
                </div>
            </div>

            <div class="links">
                <a href="https://www.cnima.com/en" target="_blank" rel="noopener noreferrer">Visit CNIMA France Website</a>
            </div>
        </div>
    </div>
</section>
