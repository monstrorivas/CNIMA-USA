<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Browse archived CNIMA USA Accordion Workshop pages from past years in New Orleans.">
    <title>CNIMA USA - Workshop Archive</title>
    <link rel="stylesheet" href="/styles-2027.css">
</head>
<body>

    <nav class="nav">
        <div class="container">
            <a href="/" class="logo">

            <div class="nav-links">
                <a href="/">Home</a>
            </div>
        </div>
    </nav>

    <section class="archive-hero">
        <div class="container">
            <h1>Workshop Archive</h1>
            <p class="lead">Every year of the CNIMA USA Accordion Workshop, preserved as it appeared at the time.</p>

    </section>

    <section class="container">
        <div class="archive-grid">
            <div class="archive-card">
                <img src="/assets/images/Nathalie and Jacques NOLA.jpg" alt="Jacques Mornet and Nathalie Boucheix at the 2026 workshop">

                    <h3>2026 Workshop</h3>

                    <a href="/archive/2026/" class="btn btn-secondary">View 2026 Page</a>

    <footer class="footer">
