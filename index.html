<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CNIMA USA - Accordion Workshop in New Orleans, May 2027. Learn from world-renowned master accordionists Jacques Mornet, Nathalie Boucheix, and Franck Angélis.">
    <title>CNIMA USA - Accordion Workshop New Orleans 2027</title>
    <link rel="stylesheet" href="styles-2027.css">
</head>
<body>
    <!--
        Hidden form for Netlify to detect at build time.
        AUTO-GENERATED from components/register.html - DO NOT EDIT MANUALLY
        Run: node scripts/generate-hidden-form.js
    -->
    <form name="registration" method="POST" netlify netlify-honeypot="bot-field" style="display: none;">
        <input type="hidden" name="form-name" value="registration" />
        <input name="bot-field" />
        <input type="hidden" name="subject" value="CNIMA USA New Registration (2027)" />
        <input name="firstName" />
        <input name="lastName" />
        <input type="email" name="email" />
        <input name="phone" />
        <input name="address" />
        <input name="city" />
        <input name="state" />
        <input name="postcode" />
        <input name="country" />
        <select name="skillLevel">
            <option value="beginner">beginner</option>
            <option value="intermediate">intermediate</option>
            <option value="advanced">advanced</option>
            <option value="professional">professional</option>
        </select>
        <select name="workshop">
            <option value="week1">week1</option>
            <option value="week2">week2</option>
            <option value="both">both</option>
        </select>
        <select name="paymentOption">
            <option value="earlybird">earlybird</option>
            <option value="full">full</option>
        </select>
        <input name="howDidYouHear" />
        <textarea name="message"></textarea>
    </form>

    <!--
        Hidden mailing list form for Netlify detection only - not for submission.
        The actual form submission comes from the visible form in contact.html
    -->
    <form name="mailing-list-detection" method="POST" netlify netlify-honeypot="bot-field" style="display: none !important; position: absolute; left: -9999px; pointer-events: none;">
        <input type="hidden" name="form-name" value="mailing-list" />
        <input name="bot-field" />
        <input type="email" name="email" />
    </form>

    <!-- Components will be loaded here -->
    <div id="nav-container"></div>
    <div id="hero-container"></div>
    <div id="about-container"></div>
    <div id="teachers-container"></div>
    <div id="workshop-container"></div>
    <div id="register-container"></div>
    <div id="contact-container"></div>
    <div id="footer-container"></div>

    <script src="components/loader.js"></script>
    <script src="registration-flow.js"></script>
</body>
</html>
