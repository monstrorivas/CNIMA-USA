<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="CNIMA USA - Accordion Workshop in New Orleans. Learn from world-renowned master accordionists Jacques Mornet, Nathalie Boucheix, and more.">
    <title>CNIMA USA - Accordion Workshop New Orleans 2026</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
            <!-- 
                Hidden form for Netlify to detect at build time. 
                AUTO-GENERATED from components/register.html - DO NOT EDIT MANUALLY 
                Run: node scripts/generate-hidden-form.js 
            --> 
            <form name="registration" method="POST" netlify netlify-honeypot="bot-field" style="display: none;" action="/success.html"> 
            <input type="hidden" name="form-name" value="registration" /> 
                <input name="bot-field" /> 
                <input type="hidden" name="subject" value="CNIMA USA New Registration (2026)" /> 
                <input name="firstName" /> 
                <input name="lastName" /> 
                <input type="email" name="email" /> 
                <input name="phone" /> 
                <input name="address" /> 
                <input name="city" /> 
                <input name="state" /> 
                <input name="postcode" /> 
                <input name="country" /> 
                <select name="skillLevel"> 
                    <option value="beginner">beginner</option> 
                    <option value="intermediate">intermediate</option> 
                    <option value="advanced">advanced</option> 
                    <option value="professional">professional</option> 
                </select> 
                <select name="workshop"> 
                    <option value="workshop1">workshop1</option> 
                    <option value="workshop2">workshop2</option> 
                    <option value="both">both</option> 
                </select> 
                <select name="paymentOption"> 
                    <option value="earlybird">earlybird</option> 
                    <option value="full">full</option> 
                </select> 
                <select name="paymentMethod"> 
                    <option value="zelle">zelle</option> 
                    <option value="venmo">venmo</option> 
                    <option value="paypal">paypal</option> 
                </select> 
                <input name="howDidYouHear" /> 
                <textarea name="message"></textarea> 
            </form>
    
    <!-- 
        Hidden mailing list form for Netlify to detect at build time.
        This ensures Netlify can detect the form fields at build time.
        Note: This form is hidden and only used for Netlify detection.
        The actual form submission comes from the visible form in contact.html
    -->
    <!-- Hidden form for Netlify detection only - not for submission -->
    <form name="mailing-list-detection" method="POST" netlify netlify-honeypot="bot-field" style="display: none !important; position: absolute; left: -9999px; pointer-events: none;">
        <input type="hidden" name="form-name" value="mailing-list" />
        <input name="bot-field" />
        <input type="email" name="email" />
    </form>
    
    <!-- Components will be loaded here -->
    <div id="nav-container"></div>
    <div id="hero-container"></div>
    <div id="about-container"></div>
    <div id="teachers-container"></div>
    <div id="workshop-container"></div>
    <div id="register-container"></div>
    <div id="contact-container"></div>
    <div id="footer-container"></div>

    <script src="components/loader.js"></script>
    <script src="script.js"></script>
</body>
</html>
