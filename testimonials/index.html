    <script>
        (function () {
            var frames = document.querySelectorAll('.testimonial-video');

            function restore(frame) {
                if (!frame.dataset.original) return;
                frame.innerHTML = frame.dataset.original;
                delete frame.dataset.original;
            }

            frames.forEach(function (frame) {
                frame.addEventListener('click', function (event) {
                    event.preventDefault();
                    frames.forEach(function (other) { if (other !== frame) restore(other); });
                    if (frame.dataset.original) return;

                    frame.dataset.original = frame.innerHTML;
                    var iframe = document.createElement('iframe');
                    iframe.src = 'https://www.youtube-nocookie.com/embed/' + frame.dataset.videoId +
                        '?autoplay=1&rel=0&playsinline=1';
                    iframe.title = frame.dataset.title;
                    iframe.allow = 'autoplay; encrypted-media; picture-in-picture; fullscreen';
                    iframe.setAttribute('allowfullscreen', '');
                    frame.replaceChildren(iframe);
                });
            });
        })();
    </script>
